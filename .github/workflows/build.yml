name: Build and Publish Wheels

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
  release:
    types:
      - published
      - created
      - edited
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  build_windows:
    name: Build Windows (C++ & CUDA)
    runs-on: windows-2022

    steps:
      - uses: actions/checkout@v4

      - name: Initialize MSVC Developer Command Prompt
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install CUDA Toolkit
        uses: Jimver/cuda-toolkit@v0.2.36
        id: cuda-toolkit
        with:
          cuda: '12.4.0'
          method: 'network'
          sub-packages: '["nvcc", "cudart", "visual_studio_integration"]'

      - name: Copy CUDA BuildCustomizations for MSBuild
        shell: pwsh
        run: |
          $cudaPath = $env:CUDA_PATH
          if (-not $cudaPath) { 
              $cudaPath = "C:\Program Files\NVIDIA GPU Computing Toolkit\CUDA\v12.4" 
          }
          $vsDir = "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\MSBuild\Microsoft\VC\v170\BuildCustomizations"
          if (Test-Path "$cudaPath\extras\visual_studio_integration\MSBuildExtensions") {
              if (!(Test-Path $vsDir)) {
                  New-Item -ItemType Directory -Force -Path $vsDir
              }
              Copy-Item "$cudaPath\extras\visual_studio_integration\MSBuildExtensions\*" $vsDir -Force
              Write-Host "Copied CUDA build customizations to $vsDir"
          } else {
              Write-Host "MSBuildExtensions not found under $cudaPath"
          }

      - name: Verify CUDA installation
        shell: pwsh
        run: |
          nvcc --version

      - name: Configure CMake
        shell: pwsh
        run: cmake -B build -G "Visual Studio 17 2022" -A x64

      - name: Build vsflip (Release)
        shell: pwsh
        run: cmake --build build --config Release

      - name: Prepare Python Wheel
        shell: pwsh
        run: |
          Copy-Item "build/Release/vsflip.dll" "vsflip/vsflip.dll" -Force
          python -m pip install --upgrade pip build wheel setuptools
          python -m build --wheel
          $wheelFile = (Get-Item dist/*.whl).FullName
          python -m wheel tags --remove --platform-tag win_amd64 $wheelFile

      - name: Upload vsflip.dll Artifact
        uses: actions/upload-artifact@v4
        with:
          name: vsflip-windows-x64-dll
          path: build/Release/vsflip.dll

      - name: Upload wheel artifact
        uses: actions/upload-artifact@v4
        with:
          name: pypi-wheel-windows-amd64
          path: dist/*.whl

      - name: Attach Assets to GitHub Release
        if: github.event_name == 'release' || startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/Release/vsflip.dll
            dist/*.whl

  build_linux:
    name: Build Linux (C++ & CUDA)
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - name: Install CUDA Toolkit
        uses: Jimver/cuda-toolkit@v0.2.36
        id: cuda-toolkit
        with:
          cuda: '12.4.0'
          method: 'network'
          sub-packages: '["nvcc", "cudart-dev"]'

      - name: Verify CUDA installation
        run: |
          nvcc --version

      - name: Configure CMake
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build vsflip (Release)
        run: cmake --build build --config Release -j$(nproc)

      - name: Upload libvsflip.so Artifact
        uses: actions/upload-artifact@v4
        with:
          name: vsflip-linux-x64-so
          path: build/*vsflip.so

      - name: Attach Assets to GitHub Release
        if: github.event_name == 'release' || startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/*vsflip.so

  build_sdist:
    name: Build source distribution
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install build tool
        run: python -m pip install --upgrade pip build

      - name: Build sdist
        run: python -m build --sdist

      - name: Upload sdist as artifact
        uses: actions/upload-artifact@v4
        with:
          name: pypi-sdist
          path: dist/*.tar.gz

      - name: Attach Assets to GitHub Release
        if: github.event_name == 'release' || startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz

  publish_pypi:
    name: Publish to PyPI
    needs: [build_windows, build_linux, build_sdist]
    if: |
      always() &&
      !contains(needs.*.result, 'failure') &&
      !contains(needs.*.result, 'cancelled') &&
      (
        github.event_name == 'release' ||
        startsWith(github.ref, 'refs/tags/v') ||
        github.event_name == 'workflow_dispatch'
      )
    runs-on: ubuntu-latest
    
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: pypi-*
          path: dist
          merge-multiple: true

      - name: Publish package to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
