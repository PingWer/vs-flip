[project]
name = "vsflip"
version = "2.0.0"
description = "A high-performance VapourSynth wrapper and plugin for the FLIP perceptual metric"
readme = "README.md"
license = {text = "MIT"}
authors = [
    { name = "PingWer", email = "r74michele@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "vapoursynth>=74"
]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["vsflip*"]

[tool.setuptools.package-data]
vsflip = ["*.dll", "*.so"]
